name: Offline auth regression

on:
  push:
    branches: ['hermes/review-A-tradememory-protocol-20261109']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      TRADEMEMORY_TSA: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated auth test dependencies
        run: python -m pip install pytest fastapi httpx python-dotenv
      - name: Exercise real middleware and dependency in-process
        run: python -m pytest -v tests/test_auth.py tests/test_auth_tenant_guard_unittest.py
